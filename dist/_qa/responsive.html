<!doctype html><html><head><meta charset="utf-8"><title>Responsive review</title><style>body{margin:20px;background:#ddd;font:14px Arial}label,button{margin-right:15px}select,button{padding:10px}iframe{display:block;height:844px;border:1px solid #888;background:white;margin-top:20px}pre{white-space:pre-wrap;font-size:12px}#frame-wrap{overflow:auto}</style></head><body><h1>Responsive review</h1><label>Page <select id="page"><option value="/">home</option><option value="/about/">about</option><option value="/services/">services</option><option value="/weddings/">weddings</option><option value="/celebrations/">celebrations</option><option value="/hospitality/">hospitality</option><option value="/gallery/">gallery</option><option value="/experience/">experience</option><option value="/contact/">contact</option></select></label><label>Width <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select></label><button id="open">Review layout</button><button id="all">Measure all layouts</button><pre id="status" role="status">Ready</pre><div id="frame-wrap"><iframe id="preview" title="Page preview" style="width:390px"></iframe></div><pre id="results"></pre><script>
const page=document.querySelector('#page'),width=document.querySelector('#width'),frame=document.querySelector('#preview'),status=document.querySelector('#status'),results=document.querySelector('#results');
function openPreview(path,w){return new Promise(resolve=>{frame.style.width=w+'px';frame.onload=async()=>{try{await frame.contentDocument.fonts.ready}catch{}setTimeout(resolve,250)};frame.src=path})}
document.querySelector('#open').onclick=async()=>{await openPreview(page.value,Number(width.value));status.textContent='Reviewing '+page.value+' at '+width.value+'px'};
function measure(){const doc=frame.contentDocument,win=frame.contentWindow;const sections=[...doc.querySelectorAll('main>section')].map(s=>({name:s.id||s.className,top:win.getComputedStyle(s).paddingTop,bottom:win.getComputedStyle(s).paddingBottom}));const badText=[...doc.querySelectorAll('h1,h2,h3,.contact-fields input,.contact-fields select')].filter(e=>{const b=e.getBoundingClientRect();return b.width>0&&(b.left<-.5||b.right>win.innerWidth+.5||e.scrollWidth>e.clientWidth+3)}).map(e=>({text:e.textContent.slice(0,45),width:e.clientWidth,scroll:e.scrollWidth}));return{path:win.location.pathname,width:win.innerWidth,scrollWidth:doc.documentElement.scrollWidth,padding:sections.every(s=>s.top==='60px'&&s.bottom==='60px'),badPadding:sections.filter(s=>s.top!=='60px'||s.bottom!=='60px'),badText,favicon:!!doc.querySelector('link[href="/favicon.svg"]')}}
document.querySelector('#all').onclick=async()=>{const checks=[];for(const w of [320,390,768,1280])for(const option of page.options){status.textContent='Measuring '+option.value+' at '+w+'px';await openPreview(option.value,w);checks.push(measure());results.textContent=JSON.stringify(checks,null,2)}status.textContent='Complete: '+checks.length+' layouts measured';await openPreview(page.value,Number(width.value))};
openPreview('/',390);
</script></body></html>
